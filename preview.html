<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Preview</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --bar: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --field: #ffffff;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-disabled: #93c5fd;
      --error: #b91c1c;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f2023;
        --bar: #2b2d31;
        --border: #3f4147;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --field: #1f2023;
        --accent-disabled: #1e3a8a;
        --error: #f87171;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 10px 16px;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
    }
    .field { display: flex; align-items: center; gap: 6px; }
    .field span { color: var(--muted); }
    .name { flex: 1 1 260px; min-width: 0; }
    .name input { flex: 1; min-width: 0; }
    input, select {
      font: inherit;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
    }
    input[type="number"] { width: 64px; }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    #status { color: var(--muted); min-width: 120px; }
    #status.error { color: var(--error); }
    .actions { display: flex; gap: 8px; margin-left: auto; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--field);
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-hover); }
    button:disabled { cursor: default; opacity: 0.6; }
    button.primary:disabled { background: var(--accent-disabled); border-color: var(--accent-disabled); opacity: 1; }
    #fallback { display: none; }
    #fallback.visible { display: inline-block; }
    main { position: relative; flex: 1; min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--bg) 70%, transparent);
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }
    #overlay[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <label class="field name">
      <span>File name</span>
      <input id="name" type="text" spellcheck="false">
      <span>.pdf</span>
    </label>
    <label class="field">
      <span>Page size</span>
      <select id="format" class="setting">
        <option value="a4">A4</option>
        <option value="letter">Letter</option>
        <option value="legal">Legal</option>
        <option value="a3">A3</option>
      </select>
    </label>
    <label class="field">
      <span>Orientation</span>
      <select id="orientation" class="setting">
        <option value="auto">Auto</option>
        <option value="portrait">Portrait</option>
        <option value="landscape">Landscape</option>
      </select>
    </label>
    <label class="field">
      <span>Margin</span>
      <input id="margin" class="setting" type="number" min="0" max="50" step="1">
      <span>mm</span>
    </label>
    <span id="status" role="status" aria-live="polite"></span>
    <div class="actions">
      <button id="fallback" type="button">Use print dialog</button>
      <button id="cancel" type="button">Cancel</button>
      <button id="download" type="button" class="primary" disabled>Download</button>
    </div>
  </header>
  <main>
    <iframe id="viewer" title="PDF preview"></iframe>
    <div id="overlay">Generating preview…</div>
  </main>
  <script type="module" src="preview.js"></script>
</body>
</html>
